# Optional manual development stack. The V17 wizard generates its own Compose
# file under the chosen state directory; it does not use this checkout's stack.
# Copy .env.example to .env and provide a private QDRANT_API_KEY before starting.
# Use a unique `docker compose -p <project>` name for separate development stacks.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set a private QDRANT_API_KEY or use the V17 wizard}
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__LOG_LEVEL: "WARN"
    volumes:
      - storage:/qdrant/storage
volumes:
  storage: {}
